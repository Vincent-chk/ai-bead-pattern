<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拼豆图纸</title></head>
<body><main class="shell">
<header><div><p class="eyebrow">BEAD STUDIO</p><h1>拼豆图纸</h1><p>把喜欢的画面，变成一颗颗拼豆。</p></div><details><summary>模型设置</summary><form id="settings"><label>服务<select name="provider"><option value="seedream">Seedream</option><option value="openai">OpenAI / 兼容服务</option></select></label><label>服务地址<input name="baseUrl" type="url" placeholder="https://..."></label><label>模型名称<input name="model"></label><label>API Key<input name="apiKey" type="password" autocomplete="off" placeholder="留空：更换服务或地址时清除密钥"></label><div class="actions"><button>保存设置</button><button type="button" id="clearSettings" class="secondary">清除设置</button></div><p id="settingsStatus" role="status"></p></form></details></header>
<section class="card"><div class="section-title"><span>01</span><h2>选择画面</h2></div><div class="source-options"><label>图纸尺寸<select id="size" aria-label="图纸尺寸"><option value="29">29 × 29</option><option value="52">52 × 52</option><option value="104">104 × 104</option></select></label><label>色卡<select id="palette"><option>MARD 兼容色卡</option></select></label></div><div class="source-grid"><div><label for="prompt">描述你的想法</label><textarea id="prompt" placeholder="例如：一只戴着草莓帽的小猫，柔和配色"></textarea><p class="notice">生成会将文字和所选参考图发送给所选服务，可能产生费用。</p><button id="generate">生成候选图</button></div><div class="upload"><span class="upload-icon">＋</span><strong>已有喜欢的图片？</strong><label class="upload-button" for="upload">上传图片</label><input id="upload" type="file" accept="image/*" aria-label="上传图片"><small>图片在本机处理</small></div></div><p id="generationStatus" role="status"></p><div id="candidates" class="candidates"></div><div id="referenceControls" hidden><label for="refPrompt">补充修改要求</label><div class="inline"><input id="refPrompt" placeholder="例如：换成蓝色"><button id="refGenerate" class="secondary">参考此图生成</button><button id="useCandidate">使用此图</button></div></div></section>
<section id="cropSection" class="card" hidden><div class="section-title"><span>02</span><h2>裁切图片</h2></div><div class="crop-layout"><div><canvas id="cropCanvas" aria-label="裁切预览"></canvas><p class="notice">拖动画框，或使用下方滑块调整。</p><label>左右移动<input id="cropX" type="range" min="0" max="1000" value="500"></label><label>上下移动<input id="cropY" type="range" min="0" max="1000" value="500"></label><label for="cropSize">缩放图片 <output id="cropZoomValue" for="cropSize">1×</output></label><input id="cropSize" type="range" min="1" max="10" step="0.1" value="1" aria-valuetext="1 倍"></div><div class="crop-options"><label>裁切结果预览</label><canvas id="cropResultPreview" width="240" height="240" aria-label="裁切结果预览"></canvas><label>图纸尺寸<select id="cropSizeChoice" aria-label="裁切后尺寸"><option value="29">29 × 29</option><option value="52">52 × 52</option><option value="104">104 × 104</option></select></label><p class="notice">屏幕颜色为近似显示，实物可能有色差。</p><button id="makePattern">生成图纸</button></div></div><p id="cropStatus" role="status"></p></section>
<section id="resultSection" class="card" hidden><div class="section-title"><span>03</span><h2>你的图纸</h2></div><div class="result-head"><div><strong id="dimensions"></strong><p id="total"></p></div><div class="actions"><label class="zoom">图纸缩放 <input id="zoom" type="range" min="50" max="200" value="100"></label><button id="download">下载 PNG</button></div></div><div class="chart-scroll"><canvas id="patternCanvas" aria-label="拼豆图纸"></canvas></div><h3>用量清单</h3><div id="legend" class="legend"></div></section>
</main><script type="module" src="./src/seed-app.js"></script></body></html>
